<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>水族館の記録</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Markdownレンダラー（CDN） -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="subpage-body">

  <div class="archive-container">
    
    <!-- ヘッダーナビゲーション -->
    <header class="archive-header">
      <div class="doc-nav">
        <a href="index.html" class="back-link">◀ 表紙に戻る</a>
      </div>
      <div class="archive-title-area">
        <span class="doc-tag">水族館の記録</span>
        <h1 class="archive-title">記録カード一覧</h1>
      </div>
      <!-- <p class="archive-lead"></p> -->
    </header>

    <main class="record-detail" id="record-detail" hidden></main>

    <div class="archive-layout" id="archive-layout">
      <!-- カテゴリ別アーカイブ索引 -->
      <aside class="category-index" aria-label="カテゴリ別アーカイブ">
        <div class="category-heading">ARCHIVE INDEX / 分類索引</div>
        <button class="category-toggle" type="button" aria-expanded="false" aria-controls="category-groups">
          カテゴリを表示 <span aria-hidden="true">＋</span>
        </button>
        <div class="category-groups" id="category-groups" hidden>
          <a class="all-cards-link" href="archive.html">すべてのカード</a>
          <section class="category-group">
            <h2>●施設別</h2>
            <ul id="aquarium-categories"></ul>
          </section>
          <section class="category-group">
            <h2>●生き物別</h2>
            <ul id="species-categories"></ul>
          </section>
        </div>
      </aside>

      <!-- カード一覧グリッド -->
      <main class="cards-grid" id="cards-container">
        <!-- JavaScriptにより tanks.json から動的にカードが生成されます -->
      </main>
    </div>

  </div>

  <!-- スライドイン式 手記ビューア（サイドドロワー） -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="note-drawer" id="note-drawer">
    <div class="drawer-header">
      <span class="drawer-id" id="drawer-id">LOG-000</span>
      <button class="drawer-close-btn" id="drawer-close" aria-label="閉じる">✕ 閉じる</button>
    </div>
    
    <div class="drawer-content" id="drawer-content">
      <!-- Markdownから変換された本文がここに入ります -->
    </div>
  </aside>

  <script src="js/archive.js"></script>
</body>
</html>

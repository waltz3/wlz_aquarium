<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>水族館の記録</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 本の見開き全体を包むコンテナ -->
  <div class="book-spread">
    
    <!-- 左ページ：画像（タイトル込み）がそのまま1ページ全体になる -->
    <section class="page left-page">
      <img src="images/title.png" alt="水族館 観測記録 扉絵" class="full-cover-image">
    </section>

    <!-- 右ページ：検索・ナビゲーション・バーコード -->
    <section class="page right-page">
      
      <!-- 上部コンテンツ群（サブタイトル ＋ 検索 ＋ ナビ） -->
      <div class="right-top-content">
        <p class="site-subtitle">生物と水槽展示<br>に関する記録</p>
        
        <!-- 検索ボックス -->
        <div class="search-container">
          <input type="text" id="search-input" placeholder="検索（水槽、魚種、館名...）" autocomplete="off">
        </div>

        <!-- メインナビゲーション -->
        <nav class="navigation">
          <ul class="nav-list">
            <li>
              <a href="species.html" class="nav-item">
                <span class="arrow">➢</span> 生き物から見る
              </a>
            </li>
            <li>
              <a href="map.html" class="nav-item">
                <span class="arrow">➢</span> 地図から見る
              </a>
            </li>
            <li>
              <a href="archive.html" class="nav-item">
                <span class="arrow">➢</span> なんでもいいから見る
              </a>
            </li>
            <li>
              <a href="about.html" class="nav-item">
                <span class="arrow">➢</span> このサイトについて
              </a>
            </li>
          </ul>
        </nav>
      </div>

      <!-- 右下のバーコード装飾（常に一番下に配置） -->
      <div class="barcode-wrapper">
        <div class="barcode-bars"></div>
        <div class="barcode-number">NO. 8049-2026-AQUATIC</div>
      </div>

    </section>

  </div>

</body>
</html>
